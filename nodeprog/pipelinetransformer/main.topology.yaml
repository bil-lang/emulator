placements:
  - match: {row: 1, col: 0}
    proc: attnController
  - match: {row: 1, col: "cols-1"}
    proc: attnRowEnd
  - match: {row: 0, col: "*"}
    proc: embedStage
  - match: {row: 1, col: "*"}
    proc: attnRelay
  - match: {row: 2, col: "*"}
    proc: ffnStage
  - match: {row: 3, col: "*"}
    proc: outputStage
default:
  proc: idle
links:
  aliases:
    attnController: {eastIn: 1, eastOut: 1, north: 0, south: 2}
    attnRelay: {eastIn: 1, eastOut: 1, north: 0, south: 2, westIn: 3, westOut: 3}
    attnRowEnd: {north: 0, south: 2, westIn: 3, westOut: 3}
    embedStage: {south: 2}
    ffnStage: {north: 0, south: 2}
    outputStage: {north: 0}
